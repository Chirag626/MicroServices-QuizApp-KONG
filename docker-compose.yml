services:

  # ==========================
  # Kong Database (PostgreSQL)
  # ==========================
  kong-db:
    image: postgres:13
    container_name: kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD}
    ports:
      - "5435:5432"
    networks:
      - microservices-network
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================
  # Kong Migrations
  # =========================
  kong-migrations:
    image: kong:3.4
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PG_DATABASE: kong
    depends_on:
      kong-db:
        condition: service_healthy
    networks:
      - microservices-network
    restart: on-failure


  # =========================
  # Kong API Gateway
  # =========================
  kong:
    image: kong:3.4
    container_name: kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/status"]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================
  # Question Service
  # =========================
  question-service:
    build:
      context: .
      dockerfile: question-service/Dockerfile
    container_name: question-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-question:5432/${QUESTION_DB}
      - SPRING_DATASOURCE_USERNAME=${QUESTION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${QUESTION_DB_PASSWORD}
    depends_on:
      postgres-question:
        condition: service_started
    networks:
      - microservices-network


  # =========================
  # Quiz Service
  # =========================
  quiz-service:
    build:
      context: .
      dockerfile: quiz-service/Dockerfile
    container_name: quiz-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-quiz:5432/${QUIZ_DB}
      - SPRING_DATASOURCE_USERNAME=${QUIZ_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${QUIZ_DB_PASSWORD}
    depends_on:
      postgres-quiz:
        condition: service_started
    networks:
      - microservices-network


  # =========================
  # Hello Service
  # =========================
  hello-service:
    build:
      context: .
      dockerfile: hello-service/Dockerfile
    container_name: hello-service
    ports:
      - "8181:8181"
    networks:
      - microservices-network


  # =========================
  # Postgres (Question)
  # =========================
  postgres-question:
    image: postgres:15
    container_name: postgres-question
    environment:
      POSTGRES_DB: ${QUESTION_DB}
      POSTGRES_USER: ${QUESTION_DB_USER}
      POSTGRES_PASSWORD: ${QUESTION_DB_PASSWORD}
    ports:
      - "5433:5432"
    networks:
      - microservices-network


  # =========================
  # Postgres (Quiz)
  # =========================
  postgres-quiz:
    image: postgres:15
    container_name: postgres-quiz
    environment:
      POSTGRES_DB: ${QUIZ_DB}
      POSTGRES_USER: ${QUIZ_DB_USER}
      POSTGRES_PASSWORD: ${QUIZ_DB_PASSWORD}
    ports:
      - "5434:5432"
    networks:
      - microservices-network


networks:
  microservices-network:
    driver: bridge

volumes:
  kong-db-data: